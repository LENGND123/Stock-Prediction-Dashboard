<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StockAI - Advanced Stock Dashboard{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Design Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-container">
    <!-- Responsive Mobile Header -->
    <div class="d-lg-none w-100 bg-dark p-3 d-flex justify-content-between align-items-center" style="position: fixed; top: 0; left: 0; z-index: 200; border-bottom: 1px solid var(--border-color); height: 60px;">
        <a href="/" class="fs-4 fw-bold text-decoration-none" style="background: linear-gradient(135deg, #60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">📈 StockAI</a>
        <button class="btn text-white p-0" id="sidebarToggle" aria-label="Toggle Navigation">
            <i class="bi bi-list fs-2"></i>
        </button>
    </div>

    <!-- Persistent Glass Sidebar -->
    <div class="sidebar" id="sidebar">
        <a class="brand" href="/">
            <i class="bi bi-graph-up-arrow"></i> StockAI
        </a>
        
        <ul class="nav-menu">
            <li>
                <a class="nav-link-item {% if request.path == '/' %}active{% endif %}" href="/">
                    <i class="bi bi-house-door"></i> Home
                </a>
            </li>
            <li>
                <a class="nav-link-item {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                    <i class="bi bi-grid-1x2"></i> Dashboard
                </a>
            </li>
            <li>
                <a class="nav-link-item {% if request.path == '/prediction' %}active{% endif %}" href="/prediction">
                    <i class="bi bi-cpu"></i> AI Prediction
                </a>
            </li>
            <li>
                <a class="nav-link-item {% if request.path == '/analytics' %}active{% endif %}" href="/analytics">
                    <i class="bi bi-bar-chart-line"></i> Analytics
                </a>
            </li>
            <li>
                <a class="nav-link-item {% if request.path == '/forecast-monitor' %}active{% endif %}" href="/forecast-monitor">
                    <i class="bi bi-shield-check"></i> Quality Monitor
                </a>
            </li>
            <li>
                <a class="nav-link-item {% if request.path == '/about' %}active{% endif %}" href="/about">
                    <i class="bi bi-info-circle"></i> About
                </a>
            </li>
        </ul>
        
        <div class="mt-auto pt-3 border-top border-secondary" style="font-size: 11px; color: var(--text-muted);">
            <p class="mb-1"><i class="bi bi-shield-check"></i> Secure Connection</p>
            <p class="mb-0">Powered by Yahoo Finance</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content" style="padding-top: 80px; padding-bottom: 40px;">
        <div class="container-fluid">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Mobile Sidebar Drawer Script -->
<script>
    document.getElementById('sidebarToggle')?.addEventListener('click', function() {
        document.getElementById('sidebar')?.classList.toggle('show');
    });

    // Close sidebar on outer click on mobile devices
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('sidebarToggle');
        if (window.innerWidth < 992 && sidebar && toggle) {
            if (!sidebar.contains(event.target) && !toggle.contains(event.target)) {
                sidebar.classList.remove('show');
            }
        }
    });
</script>
</body>
</html>
